<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Skin Intelligence & Personalized Skincare Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css?v=20.0" />
</head>

<body>
  <main class="page-main">
    <section class="page-card">
      <div class="grid-layout">
        <div class="hero-panel">
          <p class="eyebrow">Smart skincare access</p>
          <h1 class="hero-title">AI Skin Intelligence & Personalized Skincare Planner</h1>
          <p class="hero-copy">
            Log in to plan skincare routines with simple guidance, expert suggestions,
            and personal care support.
          </p>
        </div>

        <div class="form-panel">
          <div class="heading-group">
            <h2 class="section-title">Welcome back</h2>
            <p class="section-subtitle">Sign in to continue your skincare journey.</p>
          </div>

          <div class="role-selector">
            <button type="button" class="role-btn active" data-role="User">User</button>
            <button type="button" class="role-btn" data-role="Admin">Admin</button>
            <button type="button" class="role-btn" data-role="Consultant">Consultant</button>
          </div>

          <div id="loginMessage" class="feedback-msg hidden"></div>

          <form id="loginForm" class="form-grid">
            <input type="email" placeholder="Email address" class="text-input" required />
            <input type="password" placeholder="Password" class="text-input" required />
            <button type="submit" class="submit-btn">Login</button>
          </form>

          <div class="divider">or</div>

          <div class="action flex justify-center my-2">
            <div id="g_id_onload"
              data-client_id="239062846775-1cqrp8dfqrqopkkatvhqucfkoc626s7s.apps.googleusercontent.com"
              data-callback="handleGoogleCredentialResponse" data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline"
              data-text="signin_with" data-size="large"></div>
          </div>

          <p class="switch-prompt">
            Don't have an account? <a href="register.html" class="link-btn">Register here</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="script.js?v=20.0"></script>
</body>

</html>
