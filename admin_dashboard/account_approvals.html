<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Approvals - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden">
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between hidden md:flex shrink-0">
        <div>
            <div class="p-6 flex items-center gap-3 border-b border-slate-800">
                <div class="bg-teal-500 text-slate-950 p-2.5 rounded-2xl font-bold">
                    <i data-lucide="shield-check" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-white leading-tight">DermaAI</h1>
                    <p class="text-[10px] font-bold text-teal-400 uppercase">Admin Portal</p>
                </div>
            </div>
            <nav class="p-4 space-y-1 text-sm font-medium">
                <a href="/admin.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800/40">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Overview
                </a>
                <a href="/admin_dashboard/account_approvals.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-teal-400 bg-slate-800/60 font-bold border-r-4 border-teal-500">
                    <i data-lucide="user-check" class="w-4 h-4"></i> Account Approvals
                </a>
                <a href="/admin_dashboard/user_management.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800/40">
                    <i data-lucide="users" class="w-4 h-4"></i> User Management
                </a>
                <a href="/admin_dashboard/system_reports.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800/40">
                    <i data-lucide="activity" class="w-4 h-4"></i> System Reports
                </a>
                <a href="/admin_dashboard/platform_settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800/40">
                    <i data-lucide="settings" class="w-4 h-4"></i> Platform Settings
                </a>
                <a href="/admin_dashboard/recommendation_monitoring.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800/40">
                    <i data-lucide="sliders" class="w-4 h-4"></i> Recommendation Monitoring
                </a>
            </nav>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8 space-y-6">
        <h1 class="text-2xl font-bold text-slate-900">Pending Account Approvals</h1>
        <p class="text-xs text-slate-500">Review requested professional accounts</p>

        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 text-slate-600 uppercase font-bold border-b">
                    <tr>
                        <th class="p-3">Name</th>
                        <th class="p-3">Email</th>
                        <th class="p-3">Role</th>
                        <th class="p-3 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="approvals-table" class="divide-y divide-slate-100">
                    <tr><td colspan="4" class="p-4 text-center text-slate-400">Loading registrations...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        lucide.createIcons();
        async function fetchApprovals() {
            const table = document.getElementById('approvals-table');
            try {
                const res = await fetch('/api/admin/users');
                const users = await res.json();
                const pending = users.filter(u => u.status === 'pending');
                if (pending.length === 0) {
                    table.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">No pending accounts found.</td></tr>`;
                    return;
                }
                table.innerHTML = pending.map(u => `
                    <tr>
                        <td class="p-3 font-bold">${u.fullname || 'N/A'}</td>
                        <td class="p-3">${u.email}</td>
                        <td class="p-3 uppercase font-bold text-teal-600">${u.role}</td>
                        <td class="p-3 text-right space-x-2">
                            <button onclick="updateStatus('${u.email}', 'approved')" class="bg-emerald-600 text-white font-bold px-3 py-1 rounded-lg">Approve</button>
                            <button onclick="updateStatus('${u.email}', 'rejected')" class="bg-rose-600 text-white font-bold px-3 py-1 rounded-lg">Reject</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                table.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-rose-500">Failed to load data.</td></tr>`;
            }
        }

        async function updateStatus(email, action) {
            await fetch('/api/admin/update-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, action })
            });
            fetchApprovals();
        }
        document.addEventListener('DOMContentLoaded', fetchApprovals);
    </script>
</body>
</html>
