<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Settings - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden">
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between hidden md:flex shrink-0">

            <div class="p-6 flex items-center gap-3 border-b border-slate-800">
                <div class="bg-teal-500 text-slate-950 p-2.5 rounded-2xl font-bold">
                    <i data-lucide="shield-check" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-white leading-tight">DermaAI</h1>
                    <p class="text-[10px] font-bold text-teal-400 uppercase">Admin Portal</p>
                </div>
            </div>
            <nav class="p-4 space-y-1 text-sm font-medium">
                <a href="/admin.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800/40">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Overview
                </a>
                <a href="/admin_dashboard/account_approvals.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800/40">
                    <i data-lucide="user-check" class="w-4 h-4"></i> Account Approvals
                </a>
                <a href="/admin_dashboard/user_management.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800/40">
                    <i data-lucide="users" class="w-4 h-4"></i> User Management
                </a>
                <a href="/admin_dashboard/system_reports.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800/40">
                    <i data-lucide="activity" class="w-4 h-4"></i> System Reports
                </a>
                <a href="/admin_dashboard/platform_settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-teal-400 bg-slate-800/60 font-bold border-r-4 border-teal-500">
                    <i data-lucide="settings" class="w-4 h-4"></i> Platform Settings
                </a>
                <a href="/admin_dashboard/recommendation_monitoring.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800/40">
                    <i data-lucide="sliders" class="w-4 h-4"></i> Recommendation Monitoring
                </a>
            </nav>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8 space-y-6">
        <h1 class="text-2xl font-bold text-slate-900">Platform Settings</h1>
        <p class="text-xs text-slate-500">System configuration and security protocols</p>

        <div class="bg-white p-6 rounded-2xl border border-slate-200 space-y-4 text-xs max-w-xl">
            <div class="space-y-1">
                <label class="font-bold text-slate-700">Platform Name</label>
                <input type="text" value="DermaAI Clinical Portal" class="w-full p-2 border rounded-xl bg-slate-50">
            </div>
            <div class="space-y-1">
                <label class="font-bold text-slate-700">Google OAuth Client ID</label>
                <input type="text" value="680095467315-59h797sp8tinmglr3qnctq8qoi3s9clh.apps.googleusercontent.com" class="w-full p-2 border rounded-xl bg-slate-50">
            </div>
            <div class="flex items-center justify-between pt-2">
                <span class="font-bold text-slate-700">Require Admin Approval for Consultants</span>
                <input type="checkbox" checked class="w-4 h-4">
            </div>
            <button onclick="alert('Settings Saved!')" class="bg-teal-600 text-white font-bold px-4 py-2 rounded-xl">Save Settings</button>
        </div>
    </main>
    <script>lucide.createIcons();</script>

</html>
