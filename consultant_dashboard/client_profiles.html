<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Profiles - DermaAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden">

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between hidden md:flex shrink-0">
        <div>
            <div class="p-6 flex items-center gap-3 border-b border-slate-100">
                <div class="bg-teal-600 text-white p-2.5 rounded-2xl">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 leading-tight">DermaAI</h1>
                    <p class="text-xs text-slate-400">Consultant Portal</p>
                </div>
            </div>

            <nav class="p-4 space-y-1 text-sm font-medium">
                <a href="/consultant_dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
                </a>
                <a href="/consultant_dashboard/client_profiles.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-teal-700 bg-teal-50 font-bold border-r-4 border-teal-600">
                    <i data-lucide="users" class="w-4 h-4"></i> Client Profiles
                </a>
                <a href="/consultant_dashboard/skin_reports.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition">
                    <i data-lucide="file-text" class="w-4 h-4"></i> Skin Reports
                </a>
                <a href="/consultant_dashboard/progress_monitoring.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition">
                    <i data-lucide="loader" class="w-4 h-4"></i> Progress
                </a>
                <a href="/consultant_dashboard/recommendations.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition">
                    <i data-lucide="sliders" class="w-4 h-4"></i> Recommendations
                </a>
            </nav>
        </div>

        <div class="p-4 border-t border-slate-100 bg-slate-50/50">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="min-w-0">
                        <p id="user-display-name" class="text-xs font-bold text-slate-800 truncate">Loading...</p>
                        <p class="text-[10px] text-slate-500 font-medium truncate">Role: Consultant</p>
                    </div>
                </div>
                <button onclick="logout()" title="Logout" class="text-slate-400 hover:text-rose-600 p-1 rounded-lg transition cursor-pointer">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-8 space-y-6">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Client Profiles</h1>
                <p class="text-sm text-slate-500">Centralized client contact details, historical skin data, and ongoing notes.</p>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="flex gap-4 items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
            <div class="relative flex-1">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="Search clients by name or email..." onkeyup="filterClients()" class="w-full pl-9 pr-4 py-2 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-teal-500">
            </div>
        </div>

        <!-- Dynamic Container for Client Cards -->
        <div id="clients-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <p class="text-slate-400 text-xs italic col-span-2">Loading client profiles from database...</p>
        </div>
    </main>

    <script>
        lucide.createIcons();
        let allClients = [];

        document.addEventListener('DOMContentLoaded', () => {
            checkAuthState();
            fetchClientProfiles();
        });

        function checkAuthState() {
            const token = localStorage.getItem('auth_token');
            const identity = localStorage.getItem('user_identity');
            const role = localStorage.getItem('user_role');
            if (!token || role !== 'consultant') {
                window.location.href = '/index.html';
            } else {
                document.getElementById('user-display-name').innerText = identity || 'Consultant';
            }
        }

        async function fetchClientProfiles() {
            const container = document.getElementById('clients-container');
            try {
                const response = await fetch('/api/consultant/clients');
                if (response.ok) {
                    allClients = await response.json();
                    renderClients(allClients);
                } else {
                    container.innerHTML = '<p class="text-xs text-rose-500 col-span-2">Failed to load client data from server.</p>';
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p class="text-xs text-rose-500 col-span-2">Error connecting to database endpoint.</p>';
            }
        }

        function renderClients(clients) {
            const container = document.getElementById('clients-container');
            if (!clients || clients.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 col-span-2">No client records found in database.</p>';
                return;
            }

            container.innerHTML = clients.map(client => {
                const concerns = Array.isArray(client.concerns) ? client.concerns.join(', ') : (client.concerns || 'None listed');
                const hasScore = client.score !== null && client.score !== undefined;

                return `
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4 client-card">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-slate-800 text-base client-name">${client.name || 'Unnamed User'}</h3>
                                <p class="text-xs text-slate-400">${client.email}</p>
                            </div>
                            <span class="${hasScore ? 'bg-teal-100 text-teal-800' : 'bg-amber-100 text-amber-800'} text-xs font-bold px-2.5 py-1 rounded-full">
                                ${hasScore ? 'Active Client' : 'Pending Assessment'}
                            </span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs text-slate-600 bg-slate-50 p-3 rounded-xl">
                            <p><span class="font-semibold text-slate-700">Skin Type:</span> ${client.skin_type || 'N/A'}</p>
                            <p><span class="font-semibold text-slate-700">Age Group:</span> ${client.age_group || 'N/A'}</p>
                            <p><span class="font-semibold text-slate-700">Allergies:</span> ${client.allergies || 'None'}</p>
                            <p><span class="font-semibold text-slate-700">Sensitivities:</span> ${client.sensitivities || 'None'}</p>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Current Concerns / Notes</label>
                            <div class="w-full text-xs p-3 border border-slate-200 rounded-xl bg-slate-50 text-slate-700">
                                ${concerns}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterClients() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allClients.filter(c => 
                (c.name && c.name.toLowerCase().includes(query)) || 
                (c.email && c.email.toLowerCase().includes(query))
            );
            renderClients(filtered);
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
