<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Monitoring - DermaAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden">

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between hidden md:flex shrink-0">
        <div>
            <div class="p-6 flex items-center gap-3 border-b border-slate-100">
                <div class="bg-teal-600 text-white p-2.5 rounded-2xl">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 leading-tight">DermaAI</h1>
                    <p class="text-xs text-slate-400">Consultant Portal</p>
                </div>
            </div>

            <nav class="p-4 space-y-1 text-sm font-medium">
                <a href="/consultant_dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
                </a>
                <a href="/consultant_dashboard/client_profiles.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition">
                    <i data-lucide="users" class="w-4 h-4"></i> Client Profiles
                </a>
                <a href="/consultant_dashboard/skin_reports.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition">
                    <i data-lucide="file-text" class="w-4 h-4"></i> Skin Reports
                </a>
                <a href="/consultant_dashboard/progress_monitoring.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-teal-700 bg-teal-50 font-bold border-r-4 border-teal-600">
                    <i data-lucide="loader" class="w-4 h-4"></i> Progress
                </a>
                <a href="/consultant_dashboard/recommendations.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition">
                    <i data-lucide="sliders" class="w-4 h-4"></i> Recommendations
                </a>
            </nav>
        </div>

        <div class="p-4 border-t border-slate-100 bg-slate-50/50">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="min-w-0">
                        <p id="user-display-name" class="text-xs font-bold text-slate-800 truncate">Loading...</p>
                        <p class="text-[10px] text-slate-500 font-medium truncate">Role: Consultant</p>
                    </div>
                </div>
                <button onclick="logout()" title="Logout" class="text-slate-400 hover:text-rose-600 p-1 rounded-lg transition cursor-pointer">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-8 space-y-6">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Progress Monitoring</h1>
                <p class="text-sm text-slate-500">Review side-by-side historical photos and compliance logs uploaded by clients.</p>
            </div>
        </div>

        <!-- Dynamic Monitoring Container -->
        <div id="progress-container" class="space-y-6">
            <p class="text-slate-400 text-xs italic">Loading active client progress from database...</p>
        </div>
    </main>

    <script>
        lucide.createIcons();
        document.addEventListener('DOMContentLoaded', () => {
            checkAuthState();
            fetchProgressData();
        });

        function checkAuthState() {
            const token = localStorage.getItem('auth_token');
            const identity = localStorage.getItem('user_identity');
            const role = localStorage.getItem('user_role');
            if (!token || role !== 'consultant') {
                window.location.href = '/index.html';
            } else {
                document.getElementById('user-display-name').innerText = identity || 'Consultant';
            }
        }

        async function fetchProgressData() {
            const container = document.getElementById('progress-container');
            try {
                const response = await fetch('/api/consultant/clients');
                if (response.ok) {
                    const clients = await response.json();
                    renderProgress(clients);
                } else {
                    container.innerHTML = '<p class="text-xs text-rose-500">Failed to load progress data.</p>';
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p class="text-xs text-rose-500">Error connecting to backend.</p>';
            }
        }

        function renderProgress(clients) {
            const container = document.getElementById('progress-container');
            if (!clients || clients.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400">No active client logs found in database.</p>';
                return;
            }

            container.innerHTML = clients.map(c => `
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-slate-800 text-lg">Client: ${c.name || c.email}</h3>
                            <p class="text-xs text-slate-400">Skin Profile: ${c.skin_type || 'General Evaluation'}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs font-bold text-slate-500">Adherence Score</p>
                            <p class="text-lg font-extrabold text-teal-600">${c.score ? c.score + '%' : 'Pending'}</p>
                        </div>
                    </div>

                </div>
            `).join('');
            
            lucide.createIcons();
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
