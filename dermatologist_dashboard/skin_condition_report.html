<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Condition Reports - DermaAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden">

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between hidden md:flex shrink-0">
        <div>
            <div class="p-6 flex items-center gap-3 border-b border-slate-100">
                <div class="bg-teal-600 text-white p-2.5 rounded-2xl">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 leading-tight">DermaAI</h1>
                    <p class="text-xs text-slate-400">Dermatologist Portal</p>
                </div>
            </div>

            <nav class="p-4 space-y-1 text-sm font-medium">
                <a href="/dermatologist_dashboard" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
                </a>
                <a href="/dermatologist_dashboard/patient_insights.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition">
                    <i data-lucide="users" class="w-4 h-4"></i> Patient Insights
                </a>
                <a href="/dermatologist_dashboard/skin_condition_report.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-teal-700 bg-teal-50 font-bold border-r-4 border-teal-600">
                    <i data-lucide="file-text" class="w-4 h-4"></i> Skin Condition Reports
                </a>
                <a href="/dermatologist_dashboard/progress.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition">
                    <i data-lucide="loader" class="w-4 h-4"></i> Progress
                </a>
                <a href="/dermatologist_dashboard/treatment_recommendations.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition">
                    <i data-lucide="sliders" class="w-4 h-4"></i> Treatment Recommendations
                </a>
            </nav>
        </div>

        <div class="p-4 border-t border-slate-100 bg-slate-50/50">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="min-w-0">
                        <p id="user-display-name" class="text-xs font-bold text-slate-800 truncate">Loading...</p>
                        <p class="text-[10px] text-slate-500 font-medium truncate">Role: Dermatologist</p>
                    </div>
                </div>
                <button onclick="logout()" title="Logout" class="text-slate-400 hover:text-rose-600 p-1 rounded-lg transition cursor-pointer">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-8 space-y-6">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Skin Condition Reports</h1>
                <p class="text-sm text-slate-500">Clinical-grade metrics on inflammation, hydration, and pigment changes.</p>
            </div>
        </div>

        <!-- Clinical Reports Container -->
        <div id="reports-container" class="space-y-6">
            <p class="text-slate-400 text-xs italic">Fetching clinical reports from database...</p>
        </div>
    </main>

    <script>
        lucide.createIcons();
        document.addEventListener('DOMContentLoaded', () => {
            checkAuthState();
            fetchClinicalReports();
        });

        function checkAuthState() {
            const token = localStorage.getItem('auth_token');
            const identity = localStorage.getItem('user_identity');
            const role = localStorage.getItem('user_role');
            if (!token || role !== 'dermatologist') {
                window.location.href = '/index.html';
            } else {
                document.getElementById('user-display-name').innerText = identity || 'Dermatologist';
            }
        }

        async function fetchClinicalReports() {
            const container = document.getElementById('reports-container');
            try {
                const res = await fetch('/api/dermatologist/reports');
                if (res.ok) {
                    const reports = await res.json();
                    renderReports(reports);
                } else {
                    container.innerHTML = '<p class="text-xs text-rose-500">Failed to fetch skin condition reports.</p>';
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p class="text-xs text-rose-500">Error connecting to server endpoint.</p>';
            }
        }

        function renderReports(reports) {
            const container = document.getElementById('reports-container');
            if (!reports || reports.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400">No clinical reports available in database.</p>';
                return;
            }

            container.innerHTML = reports.map(r => `
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                        <div>
                            <h3 class="font-bold text-slate-800 text-base">Patient: ${r.patient_name || r.email}</h3>
                            <p class="text-xs text-slate-400">Report ID: #CR-${r.id || '001'} • Updated: ${r.updated_at ? new Date(r.updated_at).toLocaleDateString() : 'Recent'}</p>
                        </div>
                        <span class="bg-teal-600 text-white font-bold text-xs px-3 py-1 rounded-xl">
                            Overall Hydration Score: ${r.score || 'N/A'}/100
                        </span>
                    </div>

                    <!-- Clinical Metrics Breakdown -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                        <!-- Inflammation -->
                        <div class="p-4 bg-slate-50 border border-slate-100 rounded-xl space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-slate-700">Inflammation Metric</span>
                                <span class="font-extrabold text-amber-600">${r.inflammation_level || 'Moderate'}</span>
                            </div>
                            <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                                <div class="bg-amber-500 h-full" style="width: ${r.inflammation_pct || '45'}%"></div>
                            </div>
                            <p class="text-[11px] text-slate-500">Erythema score evaluated from baseline assessment.</p>
                        </div>

                        <!-- Hydration -->
                        <div class="p-4 bg-slate-50 border border-slate-100 rounded-xl space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-slate-700">Hydration Index</span>
                                <span class="font-extrabold text-teal-600">${r.score || '78'}%</span>
                            </div>
                            <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                                <div class="bg-teal-600 h-full" style="width: ${r.score || '78'}%"></div>
                            </div>
                            <p class="text-[11px] text-slate-500">Barrier integrity and trans-epidermal water loss metric.</p>
                        </div>

                        <!-- Pigment Changes -->
                        <div class="p-4 bg-slate-50 border border-slate-100 rounded-xl space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-slate-700">Pigment Variation</span>
                                <span class="font-extrabold text-indigo-600">${r.pigment_status || 'Stable'}</span>
                            </div>
                            <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                                <div class="bg-indigo-500 h-full" style="width: ${r.pigment_pct || '30'}%"></div>
                            </div>
                            <p class="text-[11px] text-slate-500">Melanin density and hyperpigmentation tracking.</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
