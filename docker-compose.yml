version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: skin_db_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: skin_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skin_api_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/skin_db
      JWT_SECRET_KEY: super_secret_jwt_key_production_grade
      JWT_REFRESH_SECRET_KEY: super_secret_refresh_jwt_key_production_grade
      CORS_ORIGINS: "http://localhost:5173,http://localhost:80"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./skin-dashboard
      dockerfile: Dockerfile
    container_name: skin_dashboard_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
