# =========================================================================
# AI Skin Intelligence & Personalized Skincare Planner - Docker Compose
# NOTE: This Compose configuration is designed for local development,
# automated integration testing, and container deployment readiness only.
# It is NOT intended for direct production cloud database provisioning.
# =========================================================================

version: '3.8'

services:
  # -----------------------------------------------------------------------
  # PostgreSQL Database Service (Local / Integration Testing Only)
  # -----------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: skin_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-skin_intelligence}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-skin_intelligence}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skin_ai_net

  # -----------------------------------------------------------------------
  # FastAPI Backend Application Service
  # -----------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: skin_ai_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/skin_intelligence}
      JWT_SECRET: ${JWT_SECRET:-YOUR_SECURE_RANDOM_SECRET_KEY_HERE_MIN_32_CHARS}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:80}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      DEV_MOCK_ASSESSMENT: ${DEV_MOCK_ASSESSMENT:-false}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - skin_ai_net

  # -----------------------------------------------------------------------
  # React Production Frontend Service (Nginx Alpine)
  # -----------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skin_ai_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - skin_ai_net

volumes:
  postgres_data:
    driver: local

networks:
  skin_ai_net:
    driver: bridge
