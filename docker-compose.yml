version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: skin_ai_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: skin_ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skin_ai_backend
    restart: always
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: skin_ai_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      JWT_SECRET: supersecretproductionjwtkey123!
      SESSION_SECRET: supersecretsessionkey123!
      FRONTEND_URL: http://localhost
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  skin-assessment-engine:
    build:
      context: ./skin-assessment-engine
      dockerfile: Dockerfile
    container_name: skin_ai_engine
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: skin_ai_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/skin_ai_db
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: skin_ai_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
      - skin-assessment-engine

volumes:
  postgres_data:
