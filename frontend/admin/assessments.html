<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assessments - GlowSense AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <div class="dashboard-layout">
    <div class="dashboard-main">
      <div class="dashboard-content">
        <h1 class="page-title">All Assessments</h1>
        <p class="page-subtitle">View all assessments across the system.</p>
        <div class="filter-bar">
          <select class="filter-input" id="filterRisk"><option value="">All Risk Levels</option><option value="Low">Low</option><option value="Moderate">Moderate</option><option value="High">High</option></select>
          <select class="filter-input" id="filterMethod"><option value="">All Methods</option><option value="form">Form</option><option value="webcam">Webcam</option></select>
        </div>
        <div class="card">
          <div class="table-wrapper">
            <table class="data-table">
              <thead><tr><th>ID</th><th>User</th><th>Date</th><th>Method</th><th>Score</th><th>Risk</th><th>Status</th></tr></thead>
              <tbody id="assessmentsTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import { initAdminAssessments } from '/js/admin.js';
    initAdminAssessments();
  </script>
</body>
</html>
