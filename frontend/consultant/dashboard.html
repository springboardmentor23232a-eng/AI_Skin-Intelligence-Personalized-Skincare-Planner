<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consultant Dashboard - GlowSense AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <div class="dashboard-layout">
    <div class="dashboard-main">
      <div class="dashboard-content">
        <h1 class="page-title">Consultant Dashboard</h1>
        <p class="page-subtitle">Review assigned users and support consultations.</p>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-card-header"><div class="stat-card-icon blue"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="8" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M2 17c0-3 3-5 6-5s6 2 6 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div></div>
            <div class="stat-card-value" id="statAssigned">0</div>
            <div class="stat-card-label">Assigned Users</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header"><div class="stat-card-icon amber"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M10 6v4l3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div></div>
            <div class="stat-card-value" id="statPending">0</div>
            <div class="stat-card-label">Pending Consultations</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header"><div class="stat-card-icon green"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 8l3 3 7-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
            <div class="stat-card-value" id="statCompleted">0</div>
            <div class="stat-card-label">Completed Consultations</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header"><div class="stat-card-icon accent"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="5" y="3" width="10" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M8 7h4M8 10h4M8 13h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div></div>
            <div class="stat-card-value" id="statRecent">0</div>
            <div class="stat-card-label">Recent Assessments</div>
          </div>
        </div>

        <div class="dashboard-grid">
          <div class="card">
            <div class="card-header"><h3 class="card-title">Recent User Assessments</h3></div>
            <div class="table-wrapper">
              <table class="data-table">
                <thead><tr><th>User</th><th>Date</th><th>Score</th><th>Risk</th><th>Type</th><th>Action</th></tr></thead>
                <tbody id="recentAssessmentsTable"></tbody>
              </table>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><h3 class="card-title">Consultation Requests</h3></div>
            <div class="table-wrapper">
              <table class="data-table">
                <thead><tr><th>User</th><th>Date</th><th>Status</th><th>Priority</th><th>Action</th></tr></thead>
                <tbody id="consultRequestsTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import { initConsultantDashboard } from '/js/consultant.js';
    initConsultantDashboard();
  </script>
</body>
</html>
