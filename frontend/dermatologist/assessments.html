<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assessments - GlowSense AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <div class="dashboard-layout">
    <div class="dashboard-main">
      <div class="dashboard-content">
        <h1 class="page-title">Assessments</h1>
        <p class="page-subtitle">Detailed assessment information for clinical review.</p>
        <div class="filter-bar">
          <select class="filter-input" id="filterRisk"><option value="">All Risk Levels</option><option value="Low">Low</option><option value="Moderate">Moderate</option><option value="High">High</option></select>
        </div>
        <div class="card">
          <div class="table-wrapper">
            <table class="data-table">
              <thead><tr><th>ID</th><th>User</th><th>Date</th><th>Method</th><th>Score</th><th>Risk</th><th>Action</th></tr></thead>
              <tbody id="assessmentsTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="detailModal">
    <div class="modal">
      <div class="modal-header"><h3 class="modal-title">Assessment Review</h3><button class="modal-close" onclick="document.getElementById('detailModal').classList.remove('active')"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M6 6l8 8M14 6l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button></div>
      <div class="modal-body" id="detailModalBody"></div>
    </div>
  </div>
  <script type="module">
    import { initDermAssessments } from '/js/dermatologist.js';
    initDermAssessments();
  </script>
</body>
</html>
