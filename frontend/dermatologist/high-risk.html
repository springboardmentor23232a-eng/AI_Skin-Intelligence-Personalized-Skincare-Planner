<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>High-Risk Cases - GlowSense AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <div class="dashboard-layout">
    <div class="dashboard-main">
      <div class="dashboard-content">
        <h1 class="page-title">High-Risk Cases</h1>
        <p class="page-subtitle">Assessments with high risk level requiring attention.</p>
        <div class="alert alert-info" style="margin-bottom:1rem;">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.5"/><path d="M10 9v4M10 7h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>AI-generated results are informational and should not be treated as a medical diagnosis.</span>
        </div>
        <div class="card">
          <div class="table-wrapper">
            <table class="data-table">
              <thead><tr><th>User</th><th>Date</th><th>Risk Level</th><th>Type</th><th>Score</th><th>Action</th></tr></thead>
              <tbody id="highRiskTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import { initDermHighRisk } from '/js/dermatologist.js';
    initDermHighRisk();
  </script>
</body>
</html>
