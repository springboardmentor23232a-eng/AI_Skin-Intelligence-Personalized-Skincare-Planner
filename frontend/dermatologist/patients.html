<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patients - GlowSense AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <div class="dashboard-layout">
    <div class="dashboard-main">
      <div class="dashboard-content">
        <h1 class="page-title">Patients</h1>
        <p class="page-subtitle">View your authorized patients.</p>
        <div class="filter-bar"><input type="text" class="search-input" placeholder="Search patients..." id="searchInput" /></div>
        <div class="card">
          <div class="table-wrapper">
            <table class="data-table">
              <thead><tr><th>Name</th><th>Age</th><th>Latest Assessment</th><th>Score</th><th>Risk</th><th>Action</th></tr></thead>
              <tbody id="patientsTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import { initDermPatients } from '/js/dermatologist.js';
    initDermPatients();
  </script>
</body>
</html>
