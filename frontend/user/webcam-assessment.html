<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webcam Assessment - GlowSense AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/assessment.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <div class="dashboard-layout">
    <div class="dashboard-main">
      <div class="dashboard-content">
        <h1 class="page-title">AI Image Assessment</h1>
        <p class="page-subtitle">Capture or upload a facial image for AI-powered skin analysis.</p>

        <div class="webcam-container">
          <div class="webcam-step-indicator">
            <div class="webcam-step active" id="stepIndicator1"><div class="webcam-step-number">1</div><span>Camera</span></div>
            <div class="webcam-step-divider"></div>
            <div class="webcam-step" id="stepIndicator2"><div class="webcam-step-number">2</div><span>Capture</span></div>
            <div class="webcam-step-divider"></div>
            <div class="webcam-step" id="stepIndicator3"><div class="webcam-step-number">3</div><span>Analyze</span></div>
            <div class="webcam-step-divider"></div>
            <div class="webcam-step" id="stepIndicator4"><div class="webcam-step-number">4</div><span>Results</span></div>
          </div>

          <div class="webcam-card">
            <div class="webcam-video-wrapper">
              <video class="webcam-video" id="webcamVideo" autoplay playsinline style="display:none;"></video>
              <canvas class="webcam-canvas" id="webcamCanvas"></canvas>
              <div class="webcam-placeholder" id="webcamPlaceholder">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><rect x="8" y="12" width="32" height="24" rx="4" stroke="currentColor" stroke-width="2"/><circle cx="24" cy="24" r="7" stroke="currentColor" stroke-width="2"/><path d="M16 36l-4 4h24l-4-4" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                <span>Camera preview will appear here</span>
              </div>
            </div>

            <div class="webcam-controls">
              <button class="btn btn-primary" id="startCameraBtn">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="5" width="11" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M13 8l3-2v6l-3-2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
                Start Camera
              </button>
              <button class="btn btn-primary" id="captureBtn" style="display:none;">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/><circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.5"/></svg>
                Capture
              </button>
              <button class="btn btn-outline" id="retakeBtn" style="display:none;">Retake</button>
              <button class="btn btn-accent" id="analyzeBtn" style="display:none;">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2l1.5 3 3 1-3 1L9 10l-1.5-3-3-1 3-1L9 2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
                Analyze Skin
              </button>
            </div>

            <div class="webcam-upload">
              <div class="upload-zone" onclick="document.getElementById('uploadInput').click()">
                <div class="upload-zone-icon">
                  <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M14 18V8M10 12l4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 18v4a2 2 0 002 2h16a2 2 0 002-2v-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <div class="upload-zone-text"><strong>Upload Image Instead</strong><br />Click to select a facial photo</div>
                <input type="file" id="uploadInput" accept="image/*" style="display:none;" />
              </div>
            </div>
          </div>

          <div id="webcamResult"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initWebcamAssessment } from '/js/webcam.js';
    initWebcamAssessment();
  </script>
</body>
</html>
