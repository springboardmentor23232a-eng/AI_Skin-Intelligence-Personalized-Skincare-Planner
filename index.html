<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Skin Intelligence & Personalized Skincare Planner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation Header -->
  <header class="navbar">
    <div class="brand" id="brand-home">
      <div class="brand-icon">✨</div>
      <span>SkinIntel<small style="font-weight: 400; font-size: 0.8rem; color: var(--text-muted);"> AI Platform</small></span>
    </div>

    <div class="nav-controls">
      <div id="nav-role-badge" class="role-badge-active hidden">
        <!-- Injected dynamically by app.js -->
      </div>
      <button id="auth-btn" class="btn btn-primary btn-sm">
        Demo Login / Select Role
      </button>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="main-content">
    <!-- View rendered dynamically based on selected role -->
  </main>

  <!-- Footer -->
  <footer style="text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid var(--border-color);">
    <p>AI Skin Intelligence & Personalized Skincare Planner • Infosys Springboard Project</p>
    <p><small>Built with Vanilla HTML5, CSS3 Glassmorphism, and ES Modules Architecture</small></p>
  </footer>

  <!-- Interactive Dummy Login Modal -->
  <div id="login-modal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h3>Select Demo Role to Authenticate</h3>
          <p class="text-muted" style="font-size: 0.85rem;">Simulate role-based access control & navigation</p>
        </div>
        <button class="close-btn" onclick="window.app.closeLoginModal()">×</button>
      </div>

      <div class="role-options-list">
        <button class="role-option-btn" onclick="window.app.selectRole('user')">
          <span style="font-size: 1.8rem;">👤</span>
          <div>
            <strong>DermaCare User (Consumer)</strong>
            <p class="text-muted" style="font-size: 0.75rem;">View skin health score, AM/PM checklist & recommendations</p>
          </div>
        </button>

        <button class="role-option-btn" onclick="window.app.selectRole('consultant')">
          <span style="font-size: 1.8rem;">💼</span>
          <div>
            <strong>Skincare Consultant</strong>
            <p class="text-muted" style="font-size: 0.75rem;">Manage client queue, review reports & build routines</p>
          </div>
        </button>

        <button class="role-option-btn" onclick="window.app.selectRole('dermatologist')">
          <span style="font-size: 1.8rem;">🩺</span>
          <div>
            <strong>Board-Certified Dermatologist</strong>
            <p class="text-muted" style="font-size: 0.75rem;">Clinical patient diagnoses, prescriptions & medical trends</p>
          </div>
        </button>

        <button class="role-option-btn" onclick="window.app.selectRole('admin')">
          <span style="font-size: 1.8rem;">🛡️</span>
          <div>
            <strong>Platform Administrator</strong>
            <p class="text-muted" style="font-size: 0.75rem;">Monitor 12 microservices, system latency & audit logs</p>
          </div>
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
