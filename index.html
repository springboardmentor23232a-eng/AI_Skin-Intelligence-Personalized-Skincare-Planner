<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Skin Intelligence & Personalized Skincare Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-main">
      <section class="page-card">
        <div class="grid-layout">
          <div class="hero-panel">
            <p class="eyebrow">Smart skincare access</p>
            <h1 class="hero-title">AI Skin Intelligence & Personalized Skincare Planner</h1>
            <p class="hero-copy">
              Log in to plan skincare routines with simple guidance, expert suggestions,
              and personal care support.
            </p>
          </div>

          <div class="form-panel">
            <div class="heading-group">
              <h2 class="section-title">Welcome back</h2>
              <p class="section-subtitle">Sign in to continue your skincare journey.</p>
            </div>

            <div class="role-selector">
              <button class="role-btn" data-role="User">User</button>
              <button class="role-btn" data-role="Admin">Admin</button>
              <button class="role-btn" data-role="Consultant">Consultant</button>
            </div>

            <form id="loginForm" class="form-grid">
              <input
                type="email"
                placeholder="Email address"
                class="text-input"
                required
              />
              <input
                type="password"
                placeholder="Password"
                class="text-input"
                required
              />
              <div class="form-actions">
                <button type="submit" class="submit-btn">Login</button>
                <button type="button" class="register-btn">Register</button>
              </div>
            </form>

            <div class="divider-row">
              <div class="divider-line"></div>
              <span>or continue with</span>
              <div class="divider-line"></div>
            </div>

            <div class="action">
              <button id="googleLoginBtn" type="button">Continue with Google</button>
              <button id="githubLoginBtn" type="button">Continue with GitHub</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
