<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Skin Intelligence - Login</title>
    <meta name="description" content="Login to your AI Skin Intelligence account for personalized skincare.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles.css">
    <style>
        .auth-tabs { display:flex; gap:0; margin-bottom:30px; border-radius:12px; overflow:hidden; border:1px solid rgba(45,55,72,0.15); }
        .auth-tab { flex:1; padding:12px; background:transparent; border:none; color:var(--text-muted); cursor:pointer; font-family:inherit; font-size:.9rem; font-weight:500; transition:.2s; }
        .auth-tab.active { background:rgba(143,175,157,0.15); color:var(--text-main); }
        .error-msg { background:rgba(255,100,100,0.15); border:1px solid rgba(255,100,100,0.4); color:#ff8080; border-radius:10px; padding:10px 14px; font-size:.85rem; margin-bottom:16px; display:none; }
        .error-msg.show { display:block; }
        .form-panel { display:none; }
        .form-panel.active { display:block; }
        .api-status { position:fixed; top:16px; right:16px; padding:8px 14px; border-radius:20px; font-size:.75rem; font-weight:600; z-index:999; }
        .api-status.online  { background:rgba(143,175,157,0.2); border:1px solid rgba(143,175,157,0.4); color:var(--primary); }
        .api-status.offline { background:rgba(200,169,106,0.2); border:1px solid rgba(200,169,106,0.4); color:var(--accent2); }
        
        .splash-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        
        .splash-card h1 {
            color: var(--text-main);
        }
        
        .splash-card input,
        .splash-card select {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(45, 55, 72, 0.2);
            color: var(--text-main);
        }
        
        .splash-card button[type="submit"] {
            background-color: var(--accent);
            color: var(--white);
        }
        
        .splash-card button[type="submit"]:hover {
            background-color: var(--primary);
        }
    </style>
</head>
<body>
    <div id="apiStatus" class="api-status offline">● API Offline</div>

    <div class="splash-screen">
        <div class="splash-logo">AI Skin Intelligence</div>
        
        <div id="logoutPrompt" style="display: none; text-align: center; margin-bottom: 20px;">
            <p style="color: var(--text-muted); margin-bottom: 15px;">You are already logged in as <strong id="currentUserEmail"></strong></p>
            <button onclick="logout()" style="background: rgba(200, 169, 106, 0.2); color: #b45309; border: 1px solid rgba(200, 169, 106, 0.4); padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: 600;">Logout to continue</button>
        </div>

        <div class="splash-card">
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')" id="tabLogin">Sign In</button>
                <button class="auth-tab" onclick="switchTab('register')" id="tabRegister">Register</button>
            </div>

            <!-- LOGIN PANEL -->
            <div class="form-panel active" id="panelLogin">
                <h1 style="font-size:1.9rem;margin-bottom:24px;">Welcome Back</h1>
                <div class="error-msg" id="loginError"></div>
                <form id="loginForm" style="text-align:left;">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required placeholder="name@example.com" autocomplete="email">
                    </div>
                    <div class="form-group" style="margin-bottom:24px;">
                        <label for="password">Password</label>
                        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                    </div>
                    <button type="submit" id="loginBtn" style="border-radius:40px;padding:15px;width:100%;">Sign In to Dashboard</button>
                    
                    <div style="margin: 20px 0; text-align: center; position: relative;">
                        <div style="position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(255,255,255,0.2);"></div>
                        <span style="background: rgba(255,255,255,0.1); padding: 0 15px; position: relative; font-size: 0.8rem; opacity: 0.7;">or</span>
                    </div>
                    
                    <button type="button" onclick="window.location.href='http://localhost:3000/api/auth/google'" style="border-radius:40px;padding:12px;width:100%;background:rgba(255,255,255,0.2);color:#fff;border:1px solid rgba(255,255,255,0.3);font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:0.2s;">
                        <svg width="18" height="18" viewBox="0 0 18 18">
                            <path d="M17.64 9.2c0-.637-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
                            <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.715H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
                            <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
                            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.159 6.656 3.58 9 3.58z" fill="#EA4335"/>
                        </svg>
                        Sign in with Google
                    </button>
                    
                    <p style="text-align:center;margin-top:16px;font-size:.8rem;opacity:.5;">
                        Admin demo: admin@skinai.com / Admin@1234
                    </p>
                </form>
            </div>

            <!-- REGISTER PANEL -->
            <div class="form-panel" id="panelRegister">
                <h1 style="font-size:1.9rem;margin-bottom:24px;">Create Account</h1>
                <div class="error-msg" id="registerError"></div>
                <form id="registerForm" style="text-align:left;">
                    <div class="form-group">
                        <label for="regName">Full Name</label>
                        <input type="text" id="regName" required placeholder="Jane Doe" autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label for="regEmail">Email Address</label>
                        <input type="email" id="regEmail" required placeholder="name@example.com" autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Password <span style="opacity:.5;font-size:.8rem;">(min 6 chars)</span></label>
                        <input type="password" id="regPassword" required placeholder="••••••••" minlength="6" autocomplete="new-password">
                    </div>
                    <div class="form-group" style="margin-bottom:24px;">
                        <label for="regRole">Account Type</label>
                        <select id="regRole">
                            <option value="user">User — Get personalized skincare plans</option>
                            <option value="consultant">Skincare Consultant — Help clients</option>
                        </select>
                        <p style="margin:10px 0 0 0;font-size:.8rem;opacity:.65;">
                            Admin accounts are separate and can only sign in from the Sign In tab.
                        </p>
                    </div>
                    <button type="submit" id="registerBtn" style="border-radius:40px;padding:15px;width:100%;">Create Account</button>
                </form>
            </div>
        </div>
    </div>

    <script src="src/script.js"></script>
    <script>
        // Tab switcher
        function switchTab(tab) {
            document.getElementById('panelLogin').classList.toggle('active', tab === 'login');
            document.getElementById('panelRegister').classList.toggle('active', tab === 'register');
            document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
            document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
        }

        // Check API health
        async function checkAPIStatus() {
            const el = document.getElementById('apiStatus');
            try {
                const res = await fetch('http://localhost:3000/api/health', { signal: AbortSignal.timeout(2000) });
                if (res.ok) {
                    el.textContent = '● API Online';
                    el.className = 'api-status online';
                } else { throw new Error(); }
            } catch {
                el.textContent = '● API Offline';
                el.className = 'api-status offline';
            }
        }
        checkAPIStatus();
        setInterval(checkAPIStatus, 10000);

        // Show logout prompt if already logged in
        if (localStorage.getItem('accessToken') && localStorage.getItem('currentUser')) {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            document.getElementById('logoutPrompt').style.display = 'block';
            document.getElementById('currentUserEmail').textContent = user.email;
            
            // Hide the main form
            document.querySelector('.splash-card').style.display = 'none';
        }
        
        // Logout function
        function logout() {
            localStorage.removeItem('accessToken');
            localStorage.removeItem('currentUser');
            document.getElementById('logoutPrompt').style.display = 'none';
            document.querySelector('.splash-card').style.display = 'block';
            
            // Clear any error messages
            const loginError = document.getElementById('loginError');
            const registerError = document.getElementById('registerError');
            if (loginError) {
                loginError.textContent = '';
                loginError.classList.remove('show');
            }
            if (registerError) {
                registerError.textContent = '';
                registerError.classList.remove('show');
            }
        }
    </script>
</body>
</html>
