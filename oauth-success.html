<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Success - AI Skin Intelligence</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <div class="splash-screen">
        <div class="splash-card">
            <div id="loadingState">
                <div style="font-size: 4rem; margin-bottom: 20px;">🔄</div>
                <h1>Completing Sign In...</h1>
                <p>Please wait while we set up your account.</p>
            </div>
            
            <div id="errorState" style="display: none;">
                <div class="banner error show">
                    <h2>Sign In Failed</h2>
                    <p id="errorMessage">An error occurred during sign in.</p>
                </div>
                <a href="login.html" class="btn-primary" style="display: inline-block; text-decoration: none; margin-top: 20px;">Try Again</a>
            </div>
        </div>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const userStr = urlParams.get('user');
        
        if (token && userStr) {
            try {
                const user = JSON.parse(decodeURIComponent(userStr));
                
                // Store authentication data
                localStorage.setItem('accessToken', token);
                localStorage.setItem('currentUser', JSON.stringify(user));
                
                // Redirect to appropriate dashboard
                const dest = { 
                    admin: 'admin_dashboard.html', 
                    consultant: 'consultant_dashboard.html', 
                    user: 'user_dashboard.html' 
                }[user.role] || 'user_dashboard.html';
                
                // Show success briefly before redirect
                setTimeout(() => {
                    window.location.href = dest;
                }, 1500);
                
            } catch (e) {
                console.error('Error parsing user data:', e);
                showError('Invalid authentication data received.');
            }
        } else {
            showError('No authentication data received. Please try again.');
        }
        
        function showError(message) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
            document.getElementById('errorMessage').textContent = message;
        }
    </script>
</body>
</html>
