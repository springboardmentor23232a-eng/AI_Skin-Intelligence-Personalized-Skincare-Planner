<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link rel="stylesheet" href="../css/login.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>


<body>


<div class="container">


    <div class="login-box">


        <h2>Create Account</h2>

        <p>Join AI Skin Intelligence</p>


        <form id="registerForm">


            <!-- Full Name -->

            <div class="input-box">

                <input
                    type="text"
                    id="name"
                    placeholder="Full Name"
                    required>

            </div>


            <!-- Email -->

            <div class="input-box">

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required>

            </div>


            <!-- Password -->

            <div class="input-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required>

            </div>


            <!-- Confirm Password -->

            <div class="input-box">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required>

            </div>


            <!-- ROLE -->

            <div class="input-box">

                <select id="role" required>

                    <option value="">Select Role</option>

                    <option value="USER">
                        User
                    </option>

                    <option value="CONSULTANT">
                        Consultant
                    </option>

                    <option value="DERMATOLOGIST">
                        Dermatologist
                    </option>

                    <option value="ADMIN">
                        Admin
                    </option>

                </select>

            </div>


            <!-- Register Button -->

            <button
                class="login-btn"
                type="submit">

                Register

            </button>


            <!-- Login -->

            <p class="register">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


        </form>


    </div>


</div>


<script src="../js/register.js"></script>


</body>

</html>
