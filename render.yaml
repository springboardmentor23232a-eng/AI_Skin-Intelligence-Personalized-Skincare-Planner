services:
  # ----------------------------------------------------
  # 1. Express Node.js Backend API Service
  # ----------------------------------------------------
  - type: web
    name: ai-skincare-express-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node backend/server.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "*"
      - key: FASTAPI_URL
        value: "https://ai-skincare-fastapi-backend.onrender.com"


  # ----------------------------------------------------
  # 2. FastAPI Python AI Engine Microservice
  # ----------------------------------------------------
  - type: web
    name: ai-skincare-fastapi-backend
    rootDir: fastapi_app
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_URL
        value: "*"
      - key: GEMINI_API_KEY
        value: "demo_key"



