services:
  # 1. PostgreSQL Managed Database
  - type: postgres
    name: skin-ai-db
    databaseName: skin_ai_db
    user: postgres_user
    plan: free

  # 2. Node.js Express Backend API
  - type: web
    name: skin-ai-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: DB_HOST
        fromDatabase:
          name: skin-ai-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: skin-ai-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: skin-ai-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: skin-ai-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: skin-ai-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://skin-ai-frontend.onrender.com

  # 3. Python FastAPI Skin Assessment Engine
  - type: web
    name: skin-ai-engine
    env: python
    plan: free
    rootDir: skin-assessment-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skin-ai-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

  # 4. Static Web Site Frontend
  - type: static
    name: skin-ai-frontend
    buildCommand: echo "Static assets ready"
    staticPublishPath: ./
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
