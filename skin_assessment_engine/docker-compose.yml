services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skin_assessment_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/skin_intelligence_db
      - JWT_SECRET_KEY=panacea_super_secret_jwt_key_2026_infosys_springboard
      - JWT_ALGORITHM=HS256
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    container_name: skin_assessment_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=skin_intelligence_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skin_intelligence_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: always

volumes:
  postgres_data:
