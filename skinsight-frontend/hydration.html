<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hydration Tracking — SkinSight</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div>
      <div class="brand"><svg class="ring-mark" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#B4574B" stroke-width="10"/><circle cx="50" cy="50" r="28" fill="none" stroke="#2E7D6B" stroke-width="8"/></svg> SkinSight</div>
      <nav>
        <a href="user.html">Dashboard</a><a href="profile.html">Profile</a><a href="skin-profile.html">Skin Profile</a><a href="lifestyle.html">Lifestyle</a><a href="sleep-tracking.html">Sleep</a><a href="hydration.html" class="active">Hydration</a><a href="environment.html">Environment</a>
        <a href="#" data-logout>Log out</a>
      </nav>
    </div>
    <div class="sidebar-foot">
      Signed in as<br><span class="mono" data-user-name>—</span>
      <div class="role-badge">User</div>
    </div>
  </aside>
  <main class="main">
    
<div class="topbar">
  <div>
    <span class="eyebrow">Daily intake</span>
    <h1>Hydration tracking</h1>
  </div>
  <div class="user-chip" data-user-chip>
    <div class="avatar">U</div>
    <span data-user-name class="mono" style="font-size:0.85rem;">—</span>
  </div>
</div>

<div class="grid grid-2">
  <div class="card">
    <span class="card-label">Today</span>
    <div class="ring-widget mt-32">
      <svg class="ring-svg" width="110" height="110" data-ring data-value="60" data-color="teal"></svg>
      <div class="ring-stat">
        <div class="num mono">1.8<span class="unit"> L</span></div>
        <div class="label">Target: 3.0 L</div>
      </div>
    </div>
    <div class="row mt-32" style="gap:10px;">
      <button class="btn btn-secondary" type="button" onclick="alert('Logged 250 ml (demo)')">+ 250 ml glass</button>
      <button class="btn btn-secondary" type="button" onclick="alert('Logged 500 ml (demo)')">+ 500 ml bottle</button>
    </div>
  </div>

  <div class="card">
    <h3>Custom entry</h3>
    <form class="stack" id="hydrationForm">
      <div class="field">
        <label for="amount">Amount (ml)</label>
        <input type="number" id="amount" name="amount" placeholder="250">
      </div>
      <div class="field">
        <label for="source">Source</label>
        <select id="source" name="source">
          <option>Water</option>
          <option>Tea / coffee</option>
          <option>Juice</option>
          <option>Other</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Add entry</button>
    </form>
    <div class="divider">target</div>
    <p>Your daily target is calculated from your skin profile and activity level in Lifestyle tracking.</p>
  </div>
</div>

  </main>
</div>
<script src="script.js"></script>
</body>
</html>
