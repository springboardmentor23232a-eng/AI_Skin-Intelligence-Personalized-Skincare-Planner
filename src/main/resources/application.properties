# Spring Application Properties
spring.application.name=ai-skincare-intelligence-platform
server.port=8080

# PostgreSQL Database Configuration (User Specified Connection Parameters)
spring.datasource.url=jdbc:postgresql://localhost:7410/ai_skincare
spring.datasource.username=postgres
spring.datasource.password=asdfghjkl
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SQL Script Execution Configuration
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# JWT Security Configuration
app.jwt.secret=9a2f8c4e7b1a3d5e8f0b2c4d6e8a1f3b5c7d9e1f3a5b7c9d1e3f5a7b9c1d3e5f
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# Google OAuth2 Client Configuration
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=profile,email
