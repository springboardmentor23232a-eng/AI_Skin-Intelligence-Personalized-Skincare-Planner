<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Checklist - DermaAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden">

    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between hidden md:flex shrink-0">
        <div>
            <div class="p-6 flex items-center gap-3 border-b border-slate-100">
                <div class="bg-teal-600 text-white p-2.5 rounded-2xl"><i data-lucide="sparkles" class="w-5 h-5"></i></div>
                <div><h1 class="font-bold text-slate-900 leading-tight">DermaAI</h1><p class="text-xs text-slate-400">User Dashboard</p></div>
            </div>
            <nav class="p-4 space-y-1 text-sm font-medium">
                <a href="/user_dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard</a>
                <a href="/user_dashboard/skin_assessment.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition"><i data-lucide="scan-face" class="w-4 h-4"></i> Skin Assessment</a>
                <a href="/user_dashboard/routine_planner.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition"><i data-lucide="calendar" class="w-4 h-4"></i> Routine Planner</a>
                <a href="/user_dashboard/product_recommendations.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition"><i data-lucide="sliders" class="w-4 h-4"></i> Product Recommendations</a>
                <a href="/user_dashboard/progress.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition"><i data-lucide="activity" class="w-4 h-4"></i> Progress</a>
                <a href="/user_dashboard/checklist.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-teal-700 bg-teal-50 font-bold border-r-4 border-teal-600"><i data-lucide="list-check" class="w-4 h-4"></i> Checklist</a>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-100 bg-slate-50/50">
            <p id="user-display-name" class="text-xs font-bold text-slate-800 truncate">Loading...</p>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8 space-y-6">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Daily Skincare Checklist</h1>
            <p class="text-sm text-slate-500">Track daily adherence to build routine consistency.</p>
        </div>

        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3 max-w-2xl">
            <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl cursor-pointer text-xs">
                <input type="checkbox" checked class="w-4 h-4 text-teal-600 rounded">
                <span>Morning Cleanser & SPF 50 Application</span>
            </label>
            <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl cursor-pointer text-xs">
                <input type="checkbox" class="w-4 h-4 text-teal-600 rounded">
                <span>Hydration Goal Met (&ge; 2.0 Liters)</span>
            </label>
            <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl cursor-pointer text-xs">
                <input type="checkbox" class="w-4 h-4 text-teal-600 rounded">
                <span>Evening Double Cleanse & Barrier Repair Night Cream</span>
            </label>
        </div>
    </main>

    <script>
        lucide.createIcons();
        document.getElementById('user-display-name').innerText = localStorage.getItem('user_identity') || 'User';
    </script>
</body>
</html>
