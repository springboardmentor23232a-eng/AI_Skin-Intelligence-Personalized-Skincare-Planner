<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Profile Assessment - DermaAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden">

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between hidden md:flex shrink-0">
        <div>
            <div class="p-6 flex items-center gap-3 border-b border-slate-100">
                <div class="bg-teal-600 text-white p-2.5 rounded-2xl">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 leading-tight">DermaAI</h1>
                    <p class="text-xs text-slate-400">User Dashboard</p>
                </div>
            </div>

            <nav class="p-4 space-y-1 text-sm font-medium">
                <a href="/user_dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
                </a>
                <a href="/user_dashboard/skin_assessment.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-teal-700 bg-teal-50 font-bold border-r-4 border-teal-600">
                    <i data-lucide="scan-face" class="w-4 h-4"></i> Skin Assessment
                </a>
                <a href="/user_dashboard/routine_planner.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition">
                    <i data-lucide="calendar" class="w-4 h-4"></i> Routine Planner
                </a>
                <a href="/user_dashboard/product_recommendations.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition">
                    <i data-lucide="sliders" class="w-4 h-4"></i> Product Recommendations
                </a>
                <a href="/user_dashboard/progress.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition">
                    <i data-lucide="activity" class="w-4 h-4"></i> Progress
                </a>
                <a href="/user_dashboard/checklist.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 transition">
                    <i data-lucide="list-check" class="w-4 h-4"></i> Checklist
                </a>
            </nav>
        </div>

        <div class="p-4 border-t border-slate-100 bg-slate-50/50">
            <div class="flex items-center justify-between">
                <p id="user-display-name" class="text-xs font-bold text-slate-800 truncate">Loading...</p>
                <button onclick="logout()" class="text-slate-400 hover:text-rose-600 p-1 rounded-lg"><i data-lucide="log-out" class="w-4 h-4"></i></button>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-8 space-y-6">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Skin Profile & Assessment Engine</h1>
            <p class="text-sm text-slate-500">Input skin parameters, lifestyle tracking, and sensitivities for evaluation.</p>
        </div>

        <form id="assessment-form" onsubmit="saveAssessment(event)" class="space-y-6 max-w-4xl">
            <!-- 1. Skin Information -->
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                <h2 class="text-sm font-bold text-teal-700 uppercase tracking-wider flex items-center gap-2">
                    <i data-lucide="info" class="w-4 h-4"></i> 1. Skin Information
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Skin Type</label>
                        <select id="skinType" class="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50">
                            <option value="Oily">Oily</option>
                            <option value="Dry">Dry</option>
                            <option value="Combination" selected>Combination</option>
                            <option value="Sensitive">Sensitive</option>
                            <option value="Normal">Normal</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Age Group</label>
                        <select id="ageGroup" class="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50">
                            <option value="Under 18">Under 18</option>
                            <option value="18-24">18-24</option>
                            <option value="25-34" selected>25-34</option>
                            <option value="35-50">35-50</option>
                            <option value="50+">50+</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-2">Skin Concerns (Select All Applicable)</label>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                        <label class="flex items-center gap-2 p-2.5 border rounded-xl bg-slate-50 cursor-pointer">
                            <input type="checkbox" name="concerns" value="Acne" checked class="rounded text-teal-600"> Acne / Breakouts
                        </label>
                        <label class="flex items-center gap-2 p-2.5 border rounded-xl bg-slate-50 cursor-pointer">
                            <input type="checkbox" name="concerns" value="Hyperpigmentation" checked class="rounded text-teal-600"> Dark Spots
                        </label>
                        <label class="flex items-center gap-2 p-2.5 border rounded-xl bg-slate-50 cursor-pointer">
                            <input type="checkbox" name="concerns" value="Dryness" class="rounded text-teal-600"> Dryness / Flakiness
                        </label>
                        <label class="flex items-center gap-2 p-2.5 border rounded-xl bg-slate-50 cursor-pointer">
                            <input type="checkbox" name="concerns" value="Fine Lines" class="rounded text-teal-600"> Aging / Fine Lines
                        </label>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Known Allergies</label>
                        <input type="text" id="allergies" class="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50" placeholder="e.g. Fragrance, Nuts, Paraben">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Sensitivities / Reactivity</label>
                        <input type="text" id="sensitivities" class="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50" placeholder="e.g. High Percentage Niacinamide, AHA">
                    </div>
                </div>
            </div>

            <!-- 2. Lifestyle & Environmental Tracking -->
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                <h2 class="text-sm font-bold text-teal-700 uppercase tracking-wider flex items-center gap-2">
                    <i data-lucide="activity" class="w-4 h-4"></i> 2. Lifestyle & Environment Tracking
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Daily Water Intake (Liters)</label>
                        <input type="number" step="0.5" id="waterIntake" value="2.5" class="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Sleep Pattern / Quality</label>
                        <select id="sleepQuality" class="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50">
                            <option value="8+ Hours / Deep">8+ Hours / Restful</option>
                            <option value="6-7 Hours / Moderate" selected>6-7 Hours / Moderate</option>
                            <option value="<5 Hours / Poor">&lt;5 Hours / Poor</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Environmental Exposure</label>
                        <select id="environment" class="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50">
                            <option value="Urban / High Pollution" selected>Urban Pollution</option>
                            <option value="High Sun Exposure">High Sun / UV</option>
                            <option value="Indoor AC / Dry">Indoor AC / Dry Air</option>
                        </select>
                    </div>
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-xl text-xs shadow-lg shadow-teal-600/20 transition cursor-pointer">
                Evaluate & Save Skin Profile
            </button>
        </form>
    </main>

    <script>
        lucide.createIcons();

    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('auth_token');
        if (!token) window.location.href = '/index.html';
        document.getElementById('user-display-name').innerText = localStorage.getItem('user_identity');
    });

    async function saveAssessment(e) {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerText = "Saving to Database...";

        const skinType = document.getElementById('skinType').value;
        const ageGroup = document.getElementById('ageGroup').value;
        const allergies = document.getElementById('allergies').value;
        const sensitivities = document.getElementById('sensitivities').value;
        const waterIntake = parseFloat(document.getElementById('waterIntake').value) || 2.0;
        const sleepQuality = document.getElementById('sleepQuality').value;
        const environment = document.getElementById('environment').value;
        const selectedConcerns = Array.from(document.querySelectorAll('input[name="concerns"]:checked')).map(c => c.value);

        let score = 90;
        if (waterIntake < 2.0) score -= 10;
        if (sleepQuality.includes('<5')) score -= 15;
        if (selectedConcerns.length > 2) score -= 10;
        score = Math.max(score, 40);

        const payload = {
            email: localStorage.getItem('user_email'),
            skinType,
            ageGroup,
            allergies,
            sensitivities,
            waterIntake,
            sleepQuality,
            environment,
            concerns: selectedConcerns,
            score
        };

        try {
            const response = await fetch('/api/user/assessment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error("Failed to save profile");

            // Sync local cache
            localStorage.setItem('user_skin_profile', JSON.stringify({ ...payload, assessmentComplete: true }));

            alert('Skin Profile & Assessment saved successfully in PostgreSQL database!');
            window.location.href = '/user_dashboard.html';
        } catch (err) {
            console.error(err);
            alert('Error saving data to database.');
            btn.disabled = false;
            btn.innerText = "Evaluate & Save Skin Profile";
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = '/index.html';
    }
</script>
</body>
</html>
